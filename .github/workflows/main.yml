<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Shop Galaxy</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:linear-gradient(180deg,#020617,#050816,#0f172a,#020617);
color:white;
overflow-x:hidden;
}

.background{
position:fixed;
inset:0;
overflow:hidden;
z-index:-1;
background:radial-gradient(circle at top,#0f172a,#020617 60%,black);
}

.aurora{
position:absolute;
inset:0;
background:
linear-gradient(120deg,rgba(0,255,255,0.08),transparent 30%),
linear-gradient(240deg,rgba(168,85,247,0.12),transparent 40%),
linear-gradient(320deg,rgba(255,0,128,0.10),transparent 35%);
filter:blur(60px);
animation:auroraMove 20s ease infinite alternate;
}

.grid-floor{
position:absolute;
bottom:-20%;
left:-50%;
width:200%;
height:60%;
background-image:
linear-gradient(rgba(0,255,255,0.15) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,0.15) 1px, transparent 1px);
background-size:60px 60px;
transform:perspective(800px) rotateX(75deg);
opacity:0.35;
}

.planet{
position:absolute;
right:5%;
top:10%;
width:300px;
height:300px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,#67e8f9,#7c3aed,#111827);
box-shadow:0 0 120px rgba(124,58,237,0.5);
animation:planetFloat 12s ease-in-out infinite;
}

.background{
position:fixed;
inset:0;
overflow:hidden;
z-index:-1;
background:linear-gradient(180deg,#020617,#050816,#0f172a,#020617);
}

.stars{
position:absolute;
width:100%;
height:100%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
animation:starsMove 200s linear infinite;
opacity:0.8;
}

.galaxy{
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle at center, rgba(128,0,255,0.35), transparent 40%),
radial-gradient(circle at 20% 30%, rgba(0,255,255,0.25), transparent 30%),
radial-gradient(circle at 80% 70%, rgba(255,0,200,0.25), transparent 35%);
filter:blur(40px);
animation:rotateGalaxy 120s linear infinite;
}

.nebula{
position:absolute;
inset:0;
background:
radial-gradient(circle at 10% 20%, rgba(0,255,255,0.18), transparent 25%),
radial-gradient(circle at 80% 30%, rgba(128,0,255,0.22), transparent 30%),
radial-gradient(circle at 50% 80%, rgba(255,0,180,0.18), transparent 35%);
filter:blur(60px);
animation:floatNebula 30s ease-in-out infinite alternate;
}

.shooting-star{
position:absolute;
width:300px;
height:2px;
background:linear-gradient(to right, white, transparent);
transform:rotate(-25deg);
animation:shooting 8s linear infinite;
opacity:0;
}

.s1{top:15%;left:-20%;}
.s2{top:45%;left:-30%;animation-delay:3s;}
.s3{top:70%;left:-25%;animation-delay:6s;}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 50px;
backdrop-filter:blur(10px);
background:rgba(0,0,0,0.4);
border-bottom:1px solid rgba(255,255,255,0.1);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:42px;
font-weight:900;
background:linear-gradient(to right,#00ffff,#8a2be2);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

nav button{
padding:14px 24px;
border:none;
border-radius:18px;
margin-left:10px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
color:white;
}

.support{background:#00bfff;}
.books{background:#8a2be2;}
.roblox{background:#ff1493;}

nav button:hover{
transform:scale(1.08);
}

.hero{
min-height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.hero h1{
font-size:90px;
max-width:1200px;
line-height:1.1;
background:linear-gradient(to right,white,#00ffff,#8a2be2);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
margin-top:25px;
font-size:22px;
max-width:900px;
color:#ccc;
}

.hero-buttons{
margin-top:40px;
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

.hero-buttons button{
padding:18px 35px;
font-size:18px;
border:none;
border-radius:18px;
font-weight:900;
cursor:pointer;
transition:0.3s;
}

.buy-btn{
background:linear-gradient(to right,#00ffff,#8a2be2);
color:black;
}

.products{
padding:100px 40px;
}

.section-title{
text-align:center;
font-size:60px;
margin-bottom:20px;
background:linear-gradient(to right,#00ffff,#8a2be2);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.products-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
max-width:1400px;
margin:auto;
margin-top:60px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:30px;
overflow:hidden;
backdrop-filter:blur(15px);
transition:0.3s;
box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 0 40px rgba(0,255,255,0.2);
}

.card-image{
height:260px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:900;
background:linear-gradient(135deg,rgba(0,255,255,0.2),rgba(128,0,255,0.2));
}

.card-content{
padding:25px;
}

.price{
font-size:36px;
font-weight:900;
color:#00ff99;
margin:15px 0;
}

.buy-product{
width:100%;
padding:16px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:900;
background:linear-gradient(to right,#00ffff,#8a2be2);
color:white;
cursor:pointer;
}

.admin-panel,
.login,
.checkout{
max-width:1200px;
margin:80px auto;
padding:50px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:35px;
backdrop-filter:blur(15px);
}

input,textarea{
width:100%;
padding:18px;
margin-top:15px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
border-radius:18px;
color:white;
font-size:16px;
}

.panel-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
margin-top:40px;
}

.panel-box{
background:rgba(0,0,0,0.4);
padding:25px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.1);
}

.main-btn{
margin-top:20px;
padding:16px 25px;
border:none;
border-radius:18px;
font-weight:900;
background:linear-gradient(to right,#00ffff,#8a2be2);
color:white;
cursor:pointer;
width:100%;
}

.pix-code{
background:linear-gradient(180deg,#020617,#050816,#0f172a,#020617);
padding:20px;
border-radius:20px;
margin-top:20px;
word-break:break-all;
border:1px solid #00ffff;
}

footer{
text-align:center;
padding:40px;
color:#aaa;
border-top:1px solid rgba(255,255,255,0.1);
margin-top:80px;
}

@keyframes starsMove{
from{transform:translateY(0);}
to{transform:translateY(-2000px);}
}

@keyframes rotateGalaxy{
from{transform:rotate(0deg) scale(1);}
to{transform:rotate(360deg) scale(1.1);}
}

@keyframes floatNebula{
from{transform:translate(0,0);}
to{transform:translate(40px,-40px);}
}

@keyframes shooting{
0%{transform:translateX(-400px) rotate(-25deg);opacity:0;}
10%{opacity:1;}
100%{transform:translateX(2200px) translateY(500px) rotate(-25deg);opacity:0;}
}

@keyframes auroraMove{
from{transform:translateX(-50px) translateY(0px);}
to{transform:translateX(50px) translateY(-30px);}
}

@keyframes planetFloat{
0%{transform:translateY(0px);}
50%{transform:translateY(-20px);}
100%{transform:translateY(0px);}
}
10%{opacity:1;}
100%{transform:translateX(2200px) translateY(500px) rotate(-25deg);opacity:0;}
}

@media(max-width:768px){
.hero h1{
font-size:52px;
}

header{
flex-direction:column;
gap:20px;
padding:20px;
}
}
</style>
</head>
